name: Compilación Maven
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Publicar JAR como artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: KingOfTheHillNK
          path: target/KingOfTheHillNK-*.jar
